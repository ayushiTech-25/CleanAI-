version: '3.8'

services:
  cleanai:
    build: .
    container_name: cleanai-app
    ports:
      - "8501:8501"
    environment:
      - CLEANAI_ENV=production
      # Pass through local host API Key variable
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
